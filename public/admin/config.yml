backend:
  name: github
  repo: medpromx/aliakbarmarzban
  branch: main

media_folder: public/images
public_folder: /images

site_url: https://aliakbarmarzban.ir
locale: en

collections:
  - name: insights_en
    label: Insights (English)
    folder: src/content/insights/en
    create: true
    slug: '{{slug}}'
    fields: &insightFields
      - { label: Title, name: title, widget: string }
      - { label: Date, name: date, widget: datetime, date_format: 'YYYY-MM-DD', time_format: false, format: 'YYYY-MM-DD' }
      - { label: Summary, name: summary, widget: text }
      - label: Related service
        name: service
        widget: select
        required: false
        options: [imo-regulation, port-governance, maritime-contracts, seafarers-stcw, international-negotiation, executive-training]
      - { label: Body, name: body, widget: markdown }
  - name: insights_fa
    label: Insights (Persian / فارسی)
    folder: src/content/insights/fa
    create: true
    slug: '{{slug}}'
    fields: *insightFields
  - name: insights_ar
    label: Insights (Arabic / العربية)
    folder: src/content/insights/ar
    create: true
    slug: '{{slug}}'
    fields: *insightFields
  - name: insights_es
    label: Insights (Spanish / Español)
    folder: src/content/insights/es
    create: true
    slug: '{{slug}}'
    fields: *insightFields
  - name: insights_fr
    label: Insights (French / Français)
    folder: src/content/insights/fr
    create: true
    slug: '{{slug}}'
    fields: *insightFields
  - name: insights_de
    label: Insights (German / Deutsch)
    folder: src/content/insights/de
    create: true
    slug: '{{slug}}'
    fields: *insightFields
  - name: insights_zh
    label: Insights (Chinese / 中文)
    folder: src/content/insights/zh
    create: true
    slug: '{{slug}}'
    fields: *insightFields
  - name: credentials
    label: Experience & Credentials
    files:
      - name: credentials
        label: Credentials
        file: src/data/credentials.json
        fields:
          - label: Groups
            name: groups
            widget: list
            fields:
              - { label: ID, name: id, widget: string }
              - label: Title
                name: title
                widget: object
                fields: &bilingual
                  - { label: English, name: en, widget: string }
                  - { label: Persian, name: fa, widget: string }
              - label: Items
                name: items
                widget: list
                fields:
                  - { label: Period, name: period, widget: object, fields: *bilingual }
                  - { label: Title, name: title, widget: object, fields: *bilingual }
                  - { label: Organisation, name: org, widget: object, fields: *bilingual }
          - label: Speaking
            name: speaking
            widget: object
            fields:
              - { label: English, name: en, widget: text }
              - { label: Persian, name: fa, widget: text }
          - label: Events
            name: events
            widget: object
            fields:
              - { label: English, name: en, widget: text }
              - { label: Persian, name: fa, widget: text }
